<!DOCTYPE html>
<html>
<head>
  <title>Socket.IO Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 60px;
      background: #075e54;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 18px;
      font-weight: 600;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    .online-button {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .online-button::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .online-button:hover {
      background: #059669;
      transform: scale(1.05);
    }

    .online-button.offline {
      background: #ef4444;
    }

    .online-button.offline:hover {
      background: #dc2626;
    }

    .online-button.offline::before {
      animation: none;
      opacity: 0.5;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .chat-container {
      flex: 1;
      padding: 80px 10px 70px;
      overflow-y: auto;
    }

    #messages {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #messages li {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: slideInLeft 0.4s ease-out;
    }

  
    #messages li.sent {
      align-self: flex-end;
      background: #dcf8c6;
      border-bottom-right-radius: 2px;
      animation: slideInRight 0.4s ease-out;
    }

  
    #messages li.received {
      align-self: flex-start;
      background: #ffffff;
      border-bottom-left-radius: 2px;
      animation: slideInLeft 0.4s ease-out;
    }


    #form {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      padding: 8px;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    #input {
      flex: 1;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    #form button {
      background: #075e54;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #form button:hover {
      background: #064c44;
    }

    /* Mobile responsive */
    @media (max-width: 600px) {
      #messages li {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-header">
    <p id="someone">💬 SyncChat</p>
    <button class="online-button">● Online</button>
  </div>


  <div class="chat-container">
    <ul id="messages"></ul>
  </div>


  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button>➤</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();

    const messages = document.getElementById('messages');
    let form = document.getElementById("form");
    let input = document.getElementById("input");
    const onlineButton = document.querySelector('.online-button');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (input.value) {
        const message = { id: "", value: input.value};
        socket.emit('chat message', message);
        input.value = "";
      }
    });

    socket.on('chat message', function (msg) {
      let item = document.createElement('li');
      item.textContent = `${msg.value}`;

      if (socket.id !== msg.id) {
        item.classList.add('received');
      } else {
        item.classList.add('sent');
      }

      messages.appendChild(item);
      
      window.scrollTo(0, document.body.scrollHeight);
    });


    socket.on('connect', function () {

      onlineButton.textContent = '● Online';

      onlineButton.classList.remove('offline');

      console.log('Connected to server');
    });

    socket.on('disconnect', function () {

      onlineButton.textContent = '● Offline';

      onlineButton.classList.add('offline');
    });

    // socket.on('broadcast message', function (message) {
    //   broadcastMessage.innerText = message;
    // });
  </script>

</body>
</html>
